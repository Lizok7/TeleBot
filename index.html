<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Telegram Shop</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .products {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            background: #6c63ff;
            color: white;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.8;
        }

        #form {
            display: none;
            margin-top: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid silver;
            outline: none;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<h1>🛍 Онлайн магазин</h1>

<div class="products">

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/0/191.png">
        <h2>iPhone 15 Pro</h2>
        <div class="price">55 999 ₴</div>
        <button class="buy-btn" data-product="iPhone 15 Pro">
            Купити
        </button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/5969/5969044.png">
        <h2>MacBook Air M3</h2>
        <div class="price">64 999 ₴</div>
        <button class="buy-btn" data-product="MacBook Air M3">
            Купити
        </button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png">
        <h2>AirPods Pro</h2>
        <div class="price">11 999 ₴</div>
        <button class="buy-btn" data-product="AirPods Pro">
            Купити
        </button>
    </div>

</div>

<form id="form">

    <h2 style="margin-top: 30px;">Оформлення замовлення</h2>

    <input type="text" placeholder="Ваше ім'я" id="user_name">
    <input type="email" placeholder="Email" id="user_email">
    <input type="text" placeholder="Телефон" id="user_phone">

    <div id="error"></div>

    <button type="button" id="order" style="margin-top: 20px;">
        Оформити замовлення
    </button>

</form>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

    let tg = window.Telegram.WebApp;

    let selectedProduct = "";

    let buyButtons = document.querySelectorAll(".buy-btn");

    buyButtons.forEach(btn => {
        btn.addEventListener("click", () => {

            selectedProduct = btn.dataset.product;

            document.querySelector(".products").style.display = "none";
            document.getElementById("form").style.display = "block";

            document.getElementById("user_name").value =
                tg.initDataUnsafe.user.first_name || "";

        });
    });

    document.getElementById("order").addEventListener("click", () => {

        let name = document.getElementById("user_name").value;
        let email = document.getElementById("user_email").value;
        let phone = document.getElementById("user_phone").value;

        if(name.length < 2) {
            document.getElementById("error").innerText =
                "Введіть ім'я";
            return;
        }

        let data = {
            product: selectedProduct,
            name: name,
            email: email,
            phone: phone
        };

        tg.sendData(JSON.stringify(data));

        tg.close();

    });

</script>

</body>
</html>
