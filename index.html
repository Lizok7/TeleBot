<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Telegram Shop</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #cart-title {
            text-align: center;
            margin-bottom: 15px;
        }

        #cart-items {
            margin-bottom: 20px;
        }

        .cart-item {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .products {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .card img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            background: #6c63ff;
            color: white;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.8;
        }

        #form {
            display: none;
            margin-top: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid silver;
            outline: none;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<h1>🛍 Онлайн магазин</h1>

<h2 id="cart-title">
    🛒 Кошик: <span id="cart-count">0</span>
</h2>

<div id="cart-items"></div>

<div class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=800&auto=format&fit=crop">
        <h2>iPhone 15 Pro</h2>
        <div class="price">55 999 ₴</div>
        <button class="buy-btn" data-product="iPhone 15 Pro">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://img.jabko.ua/image/cache/catalog/products/2025/03/051707/midnight-1-1397x1397.png.webp">
        <h2>MacBook Air M3</h2>
        <div class="price">64 999 ₴</div>
        <button class="buy-btn" data-product="MacBook Air M3">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://cdn.ya.ua/uploads/variations/smartfon-google-pixel-10-pro-16128gb-moonstone-esim1.webp">
        <h2>Google Pixel 10 Pro</h2>
        <div class="price">52 999 ₴</div>
        <button class="buy-btn" data-product="Google Pixel 10 Pro">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://img.jabko.ua/image/cache/catalog/products/2024/02/271645/ps5slim%20(1)-1397x1397.jpg.webp">
        <h2>PlayStation 5</h2>
        <div class="price">28 999 ₴</div>
        <button class="buy-btn" data-product="PlayStation 5">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://content2.rozetka.com.ua/goods/images/big/623597416.jpg">
        <h2>Dell XPS 15</h2>
        <div class="price">73 999 ₴</div>
        <button class="buy-btn" data-product="Dell XPS 15">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://img.jabko.ua/image/cache/catalog/products/2025/09/100259/855525-1397x1397.png.webp">
        <h2>Apple Watch Ultra</h2>
        <div class="price">39 999 ₴</div>
        <button class="buy-btn" data-product="Apple Watch Ultra">
            Додати в кошик
        </button>
    </div>

    <div class="card">
        <img src="https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/MQD83?wid=1144&hei=1144&fmt=jpeg&qlt=90&.v=1660803972361">
        <h2>AirPods Pro</h2>
        <div class="price">11 999 ₴</div>
        <button class="buy-btn" data-product="AirPods Pro">
            Додати в кошик
        </button>
    </div>

</div>

<button id="open-form">
    Оформити замовлення
</button>

<form id="form">

    <h2 style="margin-top: 30px;">
        Оформлення замовлення
    </h2>

    <input type="text"
           placeholder="Ваше ім'я"
           id="user_name">

    <input type="email"
           placeholder="Email"
           id="user_email">

    <input type="text"
           placeholder="Телефон"
           id="user_phone">

    <div id="error"></div>

    <button type="button" id="order">
        Підтвердити замовлення
    </button>

</form>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

    let tg = window.Telegram.WebApp;

    let cart = [];

    let buyButtons = document.querySelectorAll(".buy-btn");

    buyButtons.forEach(btn => {

        btn.addEventListener("click", () => {

            let product = btn.dataset.product;

            cart.push(product);

            updateCart();

        });

    });

    function updateCart() {

        document.getElementById("cart-count").innerText =
            cart.length;

        let cartItems =
            document.getElementById("cart-items");

        cartItems.innerHTML = "";

        cart.forEach(item => {

            cartItems.innerHTML += `
                <div class="cart-item">
                    ${item}
                </div>
            `;

        });

    }

    document.getElementById("open-form")
        .addEventListener("click", () => {

        if(cart.length === 0) {

            alert("Кошик порожній");

            return;

        }

        document.querySelector(".products")
            .style.display = "none";

        document.getElementById("open-form")
            .style.display = "none";

        document.getElementById("form")
            .style.display = "block";

    });

    document.getElementById("order")
        .addEventListener("click", () => {

        let name =
            document.getElementById("user_name").value;

        let email =
            document.getElementById("user_email").value;

        let phone =
            document.getElementById("user_phone").value;

        if(name.length < 2) {

            document.getElementById("error").innerText =
                "Введіть ім'я";

            return;

        }

        if(email.length < 5) {

            document.getElementById("error").innerText =
                "Введіть email";

            return;

        }

        if(phone.length < 5) {

            document.getElementById("error").innerText =
                "Введіть номер телефону";

            return;

        }

        let data = {

            products: cart,
            name: name,
            email: email,
            phone: phone

        };

        tg.sendData(JSON.stringify(data));

        tg.close();

    });

</script>

</body>
</html>
